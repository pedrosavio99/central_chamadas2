<!doctype html>
<html lang="pt-BR" data-tema="sistema">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/estilos.css">
  <title>Central</title>
  <script>
    // Antes do primeiro paint, para o tema salvo nao piscar o claro.
    try { document.documentElement.setAttribute("data-tema", localStorage.getItem("2brain-tema") || "sistema"); } catch (e) {}
  </script>
</head>
<body>
  <header class="barra" id="barra">
    <div class="barra-int">
      <span style="min-width:44px"></span>
      <span class="barra-titulo">Central</span>
      <div class="barra-acoes">
        <button class="icone-btn" id="btnTema" aria-label="Alternar tema">&#9680;</button>
      </div>
    </div>
  </header>

  <main class="envolucro">
    <h1 class="titulao">Início</h1>
    <p class="subtitulao">Módulos instalados neste servidor</p>

    <!-- Os modulos injetam o seu link aqui (veja modulos/central/publico/aba-central.js). -->
    <div class="faixa-chips">
      <nav class="chips" id="menuModulos" aria-label="Módulos"></nav>
    </div>

    <div class="vazio" id="semModulos">
      <div class="emoji">&#129513;</div>
      <h3>Nenhum módulo carregado</h3>
      <p>Confira se o script do módulo está no index.html e se o servidor montou o módulo.</p>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
  <script src="/central/aba-central.js"></script>
</body>
</html>
