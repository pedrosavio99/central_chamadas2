# Gerar APK do celular gateway
#
# Compila o app Voice SIP Agent (https://github.com/sparkcyf/android-voice-sip-agent) e entrega o APK
# como artefato e numa release fixa. O repositorio do app NAO publica APK pronto, entao a gente compila aqui.
#
# Como usar: aba Actions > "Gerar APK do celular gateway" > Run workflow. Leva de 15 a 40 minutos
# (compila OpenSSL, Opus e PJSIP para Android do zero). Quando acabar, o APK fica:
#   - na release "apk-latest" (aba Releases, arquivo central-gateway.apk). O link
#     https://github.com/<dono>/<repo>/releases/download/apk-latest/central-gateway.apk NUNCA muda: cada execucao troca o
#     arquivo que esta atras dele. A Central usa esse link sozinha para mostrar o QR de download.
#     (Repositorio privado: o link pede login no GitHub; o celular nao baixa sozinho.)
#   - no fim da pagina da execucao, em "Artifacts" (um .zip: extraia e instale o .apk no celular).
#
# Assinatura: a build debug e assinada com uma chave que o runner cria do zero a cada execucao, entao o Android
# recusa instalar um APK novo POR CIMA do antigo. Para as atualizacoes entrarem por cima, crie o segredo opcional
# ANDROID_DEBUG_KEYSTORE_B64 (passo a passo no MANUAL.md, "Chave de assinatura fixa"). Sem ele tudo funciona,
# mas a cada APK novo e preciso desinstalar o antigo e escanear o QR da Central de novo.
#
# Patches (pasta apk/ deste repositorio), aplicados nesta ordem depois de baixar o app:
#   1. qr-scan.patch    acrescenta o botao "Scan QR code": e com ele que a Central configura o celular
#                       sem digitar nada (31 linhas, 4 arquivos).
#   2. sem-shizuku.patch troca o Shizuku por um cliente ADB dentro do proprio app: ele se pareia uma vez
#                       com a Depuracao sem fio do celular e inicia sozinho o helper de ligacoes.
#                       Mexe no modulo privileged e em algumas telas. Leia antes de compilar.
#                       Tambem acrescenta o modo "online (relay)": o celular conecta no relay da Central pela
#                       internet (WebSocket, biblioteca OkHttp do Maven Central) em vez de falar SIP com o Asterisk,
#                       e o botao "Copy log" na tela do app. Detalhes em apk/LEIAME.md.
#
# Seguranca: o app ganha poderes de shell no celular (pela Depuracao sem fio). Por isso o codigo e FIXADO
# por hash de commit (o padrao abaixo e o v0.4.1) e as actions abaixo tambem sao fixadas por hash. Para usar
# outra versao, confira o codigo antes e cole o hash novo no campo "versao".
#
# A biblioteca libadb-android (cliente ADB, Apache-2.0 ou GPL-3.0+) e baixada do JitPack na compilacao; a OkHttp
# (Apache-2.0), do Maven Central.

name: Gerar APK do celular gateway

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Commit ou tag do app a compilar (padrao: v0.4.1, fixado pelo hash do commit)"
        required: true
        default: "298d64b89b13e7737708972947390d2d84450200"

# O workflow so le o codigo; nao precisa escrever em nada do seu repositorio.
permissions:
  contents: read

# Duas compilacoes ao mesmo tempo disputariam as mesmas pastas do script nativo.
concurrency:
  group: gerar-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Escrever so e preciso para publicar a release. O resto do workflow so le (permissions de cima).
    permissions:
      contents: write
    env:
      # Versao exigida pelo build-pjsua2.sh do app (esta escrita dentro do script).
      NDK_VERSAO: "28.2.13676358"
    steps:
      - name: Baixar o codigo do app
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sparkcyf/android-voice-sip-agent
          ref: ${{ inputs.versao }}
          path: app
          persist-credentials: false

      - name: Baixar os patches (do seu repositorio)
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: central
          sparse-checkout: apk
          persist-credentials: false

      - name: Aplicar os patches no app
        working-directory: app
        env:
          VERSAO: ${{ inputs.versao }}
        run: |
          set -euo pipefail
          for nome in qr-scan sem-shizuku; do
            patch="../central/apk/${nome}.patch"
            test -f "$patch" || { echo "Nao achei apk/${nome}.patch no seu repositorio (faca o commit da pasta apk/)."; exit 1; }
            if ! git apply --check "$patch"; then
              echo "O patch ${nome} nao encaixa na versao '$VERSAO' do app."
              echo "Os patches foram escritos para a versao padrao do campo 'versao' (v0.4.1). Use o padrao ou atualize a pasta apk/."
              exit 1
            fi
            git apply "$patch"
            echo "Aplicado: ${nome}"
          done
          git status --short | head -60

      - name: Instalar o JDK 17
        # actions/setup-java v6.2.0
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar o Android SDK e o NDK
        # android-actions/setup-android v4.0.4
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        env:
          # Pasta nova e gravavel: a do runner pode ser somente leitura para instalar o NDK.
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        with:
          # A plataforma (compileSdk) e as build-tools o proprio Gradle baixa; o NDK precisa estar
          # la antes, porque quem usa e o script nativo, que roda fora do Gradle.
          packages: "platform-tools ndk;28.2.13676358"

      - name: Instalar o swig
        run: |
          sudo apt-get update
          sudo apt-get install -y swig

      - name: Conferir as ferramentas
        run: |
          java -version
          swig -version
          test -d "$ANDROID_HOME/ndk/$NDK_VERSAO" || { echo "NDK $NDK_VERSAO nao foi instalado em $ANDROID_HOME/ndk"; ls "$ANDROID_HOME/ndk" || true; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Baixar PJSIP, OpenSSL e Opus com novas tentativas
        # O script do app baixa os tres uma vez so, sem repetir: uma queda de rede derruba o build inteiro (ja aconteceu
        # com o downloads.xiph.org). Aqui baixamos antes, com tentativas e espelhos, e conferimos o mesmo SHA-256 que o
        # script confere. Se o arquivo estiver la e correto, o script do app nao baixa nada.
        working-directory: app
        run: |
          set -euo pipefail
          script=sip-pjsua2/native/build-pjsua2.sh
          pasta=sip-pjsua2/build/pjproject
          mkdir -p "$pasta"
          valor() { sed -n "s/^$1=//p" "$script" | head -n 1; }

          baixar() {
            local nome="$1" hash="$2"
            shift 2
            local destino="$pasta/$nome"
            if [ -f "$destino" ] && echo "$hash  $destino" | sha256sum -c - >/dev/null 2>&1; then
              echo "$nome ja esta aqui e confere."
              return 0
            fi
            rm -f "$destino" "$destino.part"
            local url
            for url in "$@"; do
              echo "Baixando $nome de $url"
              if curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 300 -o "$destino.part" "$url"; then
                if echo "$hash  $destino.part" | sha256sum -c - >/dev/null 2>&1; then
                  mv "$destino.part" "$destino"
                  echo "$nome baixado e conferido."
                  return 0
                fi
                echo "O SHA-256 de $nome nao confere nesse endereco; descartando."
              else
                echo "Nao consegui baixar de $url."
              fi
              rm -f "$destino.part"
            done
            echo "ERRO: nao consegui baixar $nome de nenhum endereco. Rode o workflow de novo (Re-run all jobs): costuma ser queda de rede passageira."
            return 1
          }

          pj="$(valor PJ_VERSION)"; pj_hash="$(valor PJ_SHA256)"
          ossl="$(valor OSSL_VERSION)"; ossl_hash="$(valor OSSL_SHA256)"
          opus="$(valor OPUS_VERSION)"; opus_hash="$(valor OPUS_SHA256)"
          if [ -z "$pj" ] || [ -z "$pj_hash" ] || [ -z "$ossl" ] || [ -z "$ossl_hash" ] || [ -z "$opus" ] || [ -z "$opus_hash" ]; then
            echo "Nao achei as versoes e os hashes no script do app (versao diferente da padrao?). Deixo o proprio script baixar."
            exit 0
          fi

          baixar "pjproject-$pj.tar.gz" "$pj_hash" \
            "https://github.com/pjsip/pjproject/archive/refs/tags/$pj.tar.gz"
          baixar "openssl-$ossl.tar.gz" "$ossl_hash" \
            "https://github.com/openssl/openssl/releases/download/openssl-$ossl/openssl-$ossl.tar.gz"
          baixar "opus-$opus.tar.gz" "$opus_hash" \
            "https://downloads.xiph.org/releases/opus/opus-$opus.tar.gz" \
            "https://ftp.osuosl.org/pub/xiph/releases/opus/opus-$opus.tar.gz" \
            "https://github.com/xiph/opus/releases/download/v$opus/opus-$opus.tar.gz"

      - name: Compilar a parte nativa (PJSIP, OpenSSL e Opus)
        working-directory: app
        env:
          # So arm64: e o unico que o app empacota (abiFilters), e o celular real e arm64.
          ABIS: arm64-v8a
          APP_PLATFORM: android-30
        run: bash sip-pjsua2/native/build-pjsua2.sh

      - name: Conferir o resultado da parte nativa
        working-directory: app
        run: |
          test -f sip-pjsua2/src/generated/jniLibs/arm64-v8a/libpjsua2.so || { echo "libpjsua2.so nao foi gerada"; find sip-pjsua2/src -maxdepth 4 | head -50; exit 1; }
          ls -l sip-pjsua2/src/generated/jniLibs/arm64-v8a/

      - name: Usar a chave de assinatura fixa (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            test -s "$HOME/.android/debug.keystore" || { echo "O segredo ANDROID_DEBUG_KEYSTORE_B64 esta vazio ou nao e base64 valido."; exit 1; }
            echo "Chave de assinatura fixa restaurada: o APK novo instala por cima do antigo."
          else
            echo "Sem o segredo ANDROID_DEBUG_KEYSTORE_B64: o runner cria uma chave nova. O APK novo NAO instala por cima do antigo (desinstale o antigo antes)."
            {
              echo "### Assinatura"
              echo
              echo "Sem o segredo opcional \`ANDROID_DEBUG_KEYSTORE_B64\`, este APK foi assinado com uma chave nova. Se o Android recusar instalar por cima do app antigo, desinstale o antigo e escaneie o QR da Central de novo. Para atualizar por cima, veja \"Chave de assinatura fixa\" no MANUAL.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compilar o APK
        working-directory: app
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Separar o APK e calcular o hash
        working-directory: app
        run: |
          set -euo pipefail
          apks=(app/build/outputs/apk/debug/*.apk)
          [ "${#apks[@]}" -eq 1 ] && [ -f "${apks[0]}" ] || { echo "esperava 1 APK em app/build/outputs/apk/debug, achei: ${apks[*]}"; exit 1; }
          mkdir -p ../saida
          curto="$(git rev-parse --short=10 HEAD)"
          nome="voice-sip-agent-${curto}-gw-debug.apk"
          cp "${apks[0]}" "../saida/${nome}"
          (cd ../saida && sha256sum "${nome}" | tee "${nome}.sha256")
          {
            echo "## APK gerado"
            echo
            echo "Arquivo: \`${nome}\`"
            echo
            echo "Commit do app: \`$(git rev-parse HEAD)\`"
            echo
            echo "Patches aplicados: \`apk/qr-scan.patch\` (botao **Scan QR code**) e \`apk/sem-shizuku.patch\` (pareamento e helper proprios, sem Shizuku)."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "../saida/${nome}.sha256")\`"
            echo
            echo "Baixe na release **apk-latest** (aba Releases, arquivo \`central-gateway.apk\`) ou em **Artifacts** (fim desta pagina; extraia o .zip) e instale o .apk no celular."
            echo "E uma build **debug** (assinada com a chave de depuracao): serve para uso proprio, nao para distribuir."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar o APK como artefato
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: voice-sip-agent-apk
          path: saida/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar na release fixa (o link nao muda)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_PRIVADO: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          cd saida
          apk="$(ls ./*-gw-debug.apk | head -n 1)"
          cp "$apk" central-gateway.apk
          sha256sum central-gateway.apk | tee central-gateway.apk.sha256
          {
            echo "APK do celular gateway, ultima compilacao."
            echo
            echo "- Gerado em: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- Commit do app: $(git -C ../app rev-parse HEAD)"
            echo "- Commit deste repositorio: ${GITHUB_SHA}"
            echo "- SHA-256: $(cut -d' ' -f1 central-gateway.apk.sha256)"
            echo
            echo "Esta release e atualizada a cada execucao do workflow. O link do arquivo nao muda."
            echo "Build debug, para uso proprio."
          } > ../notas-release.md
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest central-gateway.apk central-gateway.apk.sha256 --clobber
            gh release edit apk-latest --title "APK do celular gateway (mais recente)" --notes-file ../notas-release.md
          else
            gh release create apk-latest central-gateway.apk central-gateway.apk.sha256 \
              --title "APK do celular gateway (mais recente)" --notes-file ../notas-release.md --target "${GITHUB_SHA}"
          fi
          link="https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/central-gateway.apk"
          {
            echo
            echo "## Link fixo do APK"
            echo
            echo "${link}"
            if [ "${REPO_PRIVADO:-false}" = "true" ]; then
              echo
              echo "**Atencao:** o repositorio e privado, entao este link pede login no GitHub e o celular nao baixa sozinho. Passe o .apk por cabo ou Drive."
            else
              echo
              echo "A Central mostra o QR deste link sozinha (feche e abra a janela Conectar celular)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
