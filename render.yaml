# Blueprint do Render (plano gratis). Cria so o relay; o site vai na Vercel.
# Passo a passo no MANUAL.md. O ACCESS_CODE e pedido na tela do Render ao criar (nao fica no GitHub).
services:
  - type: web
    name: central-relay
    runtime: node
    plan: free
    region: virginia
    rootDir: relay
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ACCESS_CODE
        sync: false
